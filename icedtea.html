<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ICED TEA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#e8d1d4;
    min-height:100vh;
    color:#43522f;
}

.matcha-page{
    width:100%;
    min-height:100vh;
    padding:90px 7%;
}

.top-back{
    position:absolute;
    top:30px;
    left:7%;
    text-decoration:none;
    color:#43522f;
    border:1.5px solid #43522f;
    padding:10px 22px;
    border-radius:999px;
    font-size:14px;
    font-weight:500;
}

.menu-container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.menu-title{
    font-size:72px;
    font-weight:700;
    margin-bottom:55px;
}

.menu-list{
    display:flex;
    flex-direction:column;
    gap:30px;
}

.item-top{
    display:flex;
    align-items:flex-end;
    gap:15px;
}

.item-name{
    font-size:28px;
    font-weight:700;
    white-space:nowrap;
}

.line{
    flex:1;
    border-bottom:2px dotted rgba(67,82,47,.5);
    transform:translateY(-8px);
}

.price{
    font-size:22px;
    font-weight:600;
}

.desc{
    margin-top:6px;
    font-size:17px;
    color:#4d4d4d;
}

@media(max-width:768px){

    .menu-title{
        font-size:48px;
    }

    .item-name{
        font-size:20px;
    }

    .price{
        font-size:17px;
    }

    .desc{
        font-size:14px;
    }
}

</style>
</head>

<body>

<section class="matcha-page">

<a href="menu.html" class="top-back">← Back</a>

<div class="menu-container">

<h1 class="menu-title">ICED TEA</h1>

<div class="menu-list">

<div class="menu-item">
<div class="item-top">
<h2 class="item-name">PASSION FRUIT ICED TEA</h2>
<div class="line"></div>
<span class="price">110.00</span>
</div>
<p class="desc">Tea, passion fruit flavor, and ice for a tropical refreshment.</p>
</div>

<div class="menu-item">
<div class="item-top">
<h2 class="item-name">RASPBERRY ICED TEA</h2>
<div class="line"></div>
<span class="price">110.00</span>
</div>
<p class="desc">Tea, raspberry flavor, and ice for a fruity refreshing drink.</p>
</div>

<div class="menu-item">
<div class="item-top">
<h2 class="item-name">PEACH ICED TEA</h2>
<div class="line"></div>
<span class="price">110.00</span>
</div>
<p class="desc">Tea, peach flavor, and ice for a smooth refreshing sip.</p>
</div>

</div>

</div>

</section>

</body>
</html>
